name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Oldest supported (go.mod) and current stable: the declared
        # minimum stays honest instead of only ever compiling on latest.
        go: ['1.25', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install resvg (fidelity harness renderer)
        run: sudo sh scripts/ci-install-resvg.sh
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Fuzz smoke
        run: |
          go test -fuzz=FuzzParse -fuzztime=20s -run FuzzParse ./internal/path/
          go test -fuzz=FuzzOptimize -fuzztime=20s -run FuzzOptimize .

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE=ghcr.io/${{ github.repository_owner }}/silk
          IMAGE=${IMAGE,,}
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
