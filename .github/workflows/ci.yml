name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: &docs
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore: *docs

# Jobs opt into the permissions they need; nothing is granted by default.
permissions: {}

# A newer push to the same branch supersedes the running one; master and
# tags always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        # Oldest supported (go.mod) and current stable: the declared
        # minimum stays honest instead of only ever compiling on latest.
        go: ['1.25', 'stable']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install resvg (fidelity harness renderer)
        run: sudo sh scripts/ci-install-resvg.sh
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Fuzz smoke
        run: |
          go test -fuzz=FuzzParse -fuzztime=20s -run FuzzParse ./internal/path/
          go test -fuzz=FuzzOptimize -fuzztime=20s -run FuzzOptimize .

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE=ghcr.io/$OWNER/silk
          IMAGE=${IMAGE,,}
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
