name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'

# Jobs opt into the permissions they need; nothing is granted by default.
permissions: {}

# A newer push to the same branch supersedes the running one; master and
# tags always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        # Oldest supported (go.mod) and current stable: the declared
        # minimum stays honest instead of only ever compiling on latest.
        go: ['1.26', 'stable']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install resvg (fidelity harness renderer)
        run: sudo sh scripts/ci-install-resvg.sh
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        # The runner image ships Google Chrome; the browser fidelity check
        # must run there, not silently skip.
        env:
          SILK_REQUIRE_CHROME: 1
        run: go test ./...
      - name: Race
        # The library is called concurrently by servers; one Go version is
        # enough to catch a data race.
        if: matrix.go == 'stable'
        run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Fuzz smoke
        # Both targets share the 20 s budget in parallel: a smoke run, not a
        # campaign, so halving the workers per target costs nothing useful.
        # Fuzzing is randomized, so one Go version is as good as two.
        run: |
          go test -fuzz=FuzzParse -fuzztime=20s -run FuzzParse ./internal/path/ &
          go test -fuzz=FuzzOptimize -fuzztime=20s -run FuzzOptimize . &
          wait %1 && wait %2

  image:
    needs: [test, fuzz]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE=ghcr.io/$OWNER/silk
          IMAGE=${IMAGE,,}
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
