version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
  # Keeps the digest pins in the Dockerfile current. The images in
  # .gitlab-ci.yml are not covered: refresh them by hand alongside.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
