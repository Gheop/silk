stages: [test, release]

# GitHub Actions is the primary CI on every push; this pipeline re-runs the
# suite on a second runner for releases and publishes the GitLab image.
test:
  stage: test
  image: golang:1.26
  timeout: 15m
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - sh scripts/ci-install-resvg.sh
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./...

release-image:
  stage: release
  image: docker:27
  services: [docker:27-dind]
  timeout: 15m
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - VERSION="${CI_COMMIT_TAG#v}"
    - docker build -t "$CI_REGISTRY_IMAGE:$VERSION" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE:latest"
